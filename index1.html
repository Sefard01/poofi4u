<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poofi4u - Peaceful Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          keyframes: {
            gentleShake: {
              '20%, 60%': {
                transform: 'translateX(-4px)'
              },
              '40%, 80%': {
                transform: 'translateX(4px)'
              }
            }
          },
          animation: {
            'gentle-shake': 'gentleShake 0.4s ease both'
          }
        }
      }
    }
  </script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" >
</head>
<body class="min-h-screen overflow-hidden font-jakarta bg-[#f7f5f0] flex items-center justify-center text-[#4a4543]">

  <!-- NAVBAR -->
  <nav class="fixed top-0 left-0 w-screen flex justify-between items-center px-8 py-4 bg-[rgba(247,245,240,0.85)] backdrop-blur-[10px] border-b border-[rgba(215,210,200,0.6)] z-[1000]">
    <div class="text-base font-semibold text-[#5c5350] tracking-[0.5px]">
      <i class="fa-solid fa-leaf text-[#6c8072]"></i> Poofi4u</div>
    <div class="relative">
      <button id="settingBtn" class="border border-[#dcd6cd] bg-white text-[#6b625e] px-[14px] py-[7px] rounded-[20px] cursor-pointer text-[13px] font-jakarta transition-all duration-200 flex items-center gap-[7px] shadow-[0_2px_6px_rgba(0,0,0,0.02)] hover:bg-[#f2ece4] hover:border-[#cbc3b7]">
        <i class="fa-solid fa-gear"></i> Settings </button>
      <div id="dropdownMenu" class="absolute right-0 top-[45px] bg-white border border-[#e2ddd5] rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.05)] w-[150px] hidden flex-col p-[6px] z-[1001]">
        <button onclick="openPayment()" class="bg-transparent border-none text-left px-3 py-2 text-[13px] font-jakarta text-[#5c5350] rounded-lg cursor-pointer flex items-center gap-[9px] transition-colors hover:bg-[#f7f5f0]" >
          <i class="fa-solid fa-wallet"></i> Payment</button>
      </div>
    </div>
  </nav>
  <!-- GAME WINDOW -->
  <div id="game" class="relative z-[5] w-[620px] max-w-[92vw] p-8 bg-white border border-[#eae5dc] shadow-[0_20px_40px_rgba(110,100,90,0.06)] rounded-[24px] transition-colors duration-300">
    <!-- HEADER BAR -->
    <div class="flex justify-between items-center mb-6 text-[13px]">
      <!-- Disk Controls -->
      <div class="flex items-center gap-[10px]">
        <span class="text-[#7a706b] font-medium"> Disks:</span>
        <div id="diskCount" class="bg-[#f7f5f0] px-3 py-1 rounded-lg border border-[#e8e3d9] font-semibold text-[#5c5350]">
          3</div>
        <button onclick="removeDisk()" class="border border-[#dcd6cd] bg-white text-[#6b625e] px-3 py-[6px] rounded-[10px] cursor-pointer text-[13px] font-jakarta transition-all duration-200 flex items-center gap-[6px] shadow-[0_1px_3px_rgba(0,0,0,0.01)] hover:bg-[#f7f5f0] hover:border-[#cbc3b7]" >
          <i class="fa-solid fa-minus"></i>
        </button>
        <button onclick="addDisk()" class="border border-[#dcd6cd] bg-white text-[#6b625e] px-3 py-[6px] rounded-[10px] cursor-pointer text-[13px] font-jakarta transition-all duration-200 flex items-center gap-[6px] shadow-[0_1px_3px_rgba(0,0,0,0.01)] hover:bg-[#f7f5f0] hover:border-[#cbc3b7]">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <!-- Moves -->
      <div class="flex items-center gap-[10px]">
        <span id="movesText" class="text-[#7a706b] font-medium" > Moves: 0 </span>
      </div>
      <!-- Restart -->
      <div class="flex items-center gap-[10px]">
        <button onclick="resetGame()" class="bg-[#6c8072] text-white border border-[#6c8072] px-3 py-[6px] rounded-[10px] cursor-pointer text-[13px] font-jakarta transition-all duration-200 flex items-center gap-[6px] hover:bg-[#5b6d60]" >
          <i class="fa-solid fa-rotate-right"></i> Restart</button>
      </div>
    </div>
    <!-- BOARD -->
    <div class="h-[190px] flex items-end justify-around gap-4 px-4 bg-[#faf8f5] rounded-2xl border border-[#f0ece4]">
      <!-- TOWER 1 -->
      <div data-tower="0" class="relative w-[30%] h-[150px] cursor-pointer before:content-[''] before:absolute before:w-full before:h-[3px] before:bg-[#dcd6cd] before:bottom-0 before:left-0 before:rounded-[3px] after:content-[''] after:absolute after:w-[3px] after:h-[130px] after:bg-[#dcd6cd] after:left-1/2 after:bottom-0 after:-translate-x-1/2 after:rounded-[3px]">
        <div class="absolute -bottom-7 left-1/2 -translate-x-1/2 text-xs font-medium text-[#7a706b] whitespace-nowrap flex items-center gap-[6px] bg-white px-[10px] py-[2px] border border-[#e8e3d9] rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.02)]">
          <i class="fa-solid fa-user text-[#8c7a6b]"></i>me</div>
        <div class="absolute bottom-[3px] left-1/2 -translate-x-1/2 w-full h-[130px] flex flex-col-reverse items-center justify-start z-[2]" ></div>
      </div>
      <!-- TOWER 2 -->
      <div data-tower="1" class="relative w-[30%] h-[150px] cursor-pointer before:content-[''] before:absolute before:w-full before:h-[3px] before:bg-[#dcd6cd] before:bottom-0 before:left-0 before:rounded-[3px] after:content-[''] after:absolute after:w-[3px] after:h-[130px] after:bg-[#dcd6cd] after:left-1/2 after:bottom-0 after:-translate-x-1/2 after:rounded-[3px]">
        <div class="absolute -bottom-7 left-1/2 -translate-x-1/2 text-xs font-medium text-[#7a706b] whitespace-nowrap flex items-center gap-[6px] bg-white px-[10px] py-[2px] border border-[#e8e3d9] rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.02)]">
          <i class="fa-solid fa-heart text-[#c48b8b]"></i> poofi4u </div>
        <div  class="absolute bottom-[3px] left-1/2 -translate-x-1/2 w-full h-[130px] flex flex-col-reverse items-center justify-start z-[2]"></div>
      </div>
      <!-- TOWER 3 -->
      <div data-tower="2" class="relative w-[30%] h-[150px] cursor-pointer before:content-[''] before:absolute before:w-full before:h-[3px] before:bg-[#dcd6cd] before:bottom-0 before:left-0 before:rounded-[3px] after:content-[''] after:absolute after:w-[3px] after:h-[130px] after:bg-[#dcd6cd] after:left-1/2 after:bottom-0 after:-translate-x-1/2 after:rounded-[3px]">
        <div class="absolute -bottom-7 left-1/2 -translate-x-1/2 text-xs font-medium text-[#7a706b] whitespace-nowrap flex items-center gap-[6px] bg-white px-[10px] py-[2px] border border-[#e8e3d9] rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.02)]" >
          <i class="fa-solid fa-seedling text-[#6c8072]"></i> someoneloved
        </div>
        <div class="absolute bottom-[3px] left-1/2 -translate-x-1/2 w-full h-[130px] flex flex-col-reverse items-center justify-start z-[2]"></div>
      </div>
    </div>
    <!-- FOOTER -->
    <div class="flex justify-between items-center mt-10 text-[13px] text-[#8c827c]">
      <div id="message"> Click a token to begin your journey. </div>
      <div id="minMovesText">  Min Moves: 7</div>
    </div>
  </div>
  <!-- GUIDE ARROW -->
  <svg id="guideArrow" aria-hidden="true" class="fixed inset-0 w-screen h-screen pointer-events-none z-[100] hidden text-[#8c7a6b]" >
    <defs>
      <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" >
        <polygon points="0 1, 8 4, 0 7" fill="currentColor" ></polygon>
      </marker>
    </defs>
    <path id="guidePath" d="M 0 0 Q 0 0 0 0" marker-end="url(#arrowHead)" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="4 6"  opacity="0.6" ></path>
  </svg>

  <!-- VICTORY MODAL -->
  <div id="victoryModal" class="fixed inset-0 bg-[rgba(90,85,80,0.3)] backdrop-blur-[4px] hidden items-center justify-center z-[10000] opacity-0 pointer-events-none transition-opacity duration-300">
    <div  class="bg-white border border-[#eae5dc] p-8 rounded-[20px] text-center shadow-[0_20px_40px_rgba(0,0,0,0.08)] w-[320px]">
      <h2  class="text-[18px] text-[#5c5350] mb-[6px] font-semibold" > Harmony Achieved </h2>
      <p id="victoryText" class="text-[13px] text-[#8c827c] mb-6">You finished the puzzle. </p>
      <button onclick="closeVictoryModal()" class="border border-[#dcd6cd] bg-white text-[#6b625e] px-3 py-[6px] rounded-[10px] cursor-pointer text-[13px] font-jakarta transition-all duration-200 inline-flex items-center gap-[6px] hover:bg-[#f7f5f0] hover:border-[#cbc3b7]">
        <i class="fa-solid fa-play"></i> Play Again</button>
    </div>
  </div>
  <script>
    const settingBtn = document.getElementById("settingBtn");
    const dropdownMenu = document.getElementById("dropdownMenu");
    settingBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("hidden");
      dropdownMenu.classList.toggle("flex");
    });
    window.addEventListener("click", () => {
      dropdownMenu.classList.add("hidden");
      dropdownMenu.classList.remove("flex");
    });
    function openPayment() {
      alert("Opening payment gateway...");
    }
    // GAME VARIABLES
    let numberOfDisks = 3;
    const MIN_DISKS = 1;
    const MAX_DISKS = 5;
    let towers = [[], [], []];
    let selectedTower = null;
    let moves = 0;
    // START GAME
    function startGame() {
      towers = [[], [], []];
      selectedTower = null;
      moves = 0;
      for (
        let disk = numberOfDisks;
         disk >= 1; 
         disk--
      ) { towers[0].push(disk);}
      updateUI();
    }
    // UPDATE UI
    function updateUI() {
      const towerElements = document.querySelectorAll("[data-tower]");
      towerElements.forEach((towerElement, towerIndex) => {
          const container = towerElement.querySelector(".absolute.bottom-\\[3px\\]");
          container.innerHTML = "";
          towers[towerIndex].forEach((disk, diskIndex) => {
              const element = document.createElement("div");
              element.className = "h-5 mt-[3px] rounded-lg flex items-center justify-center text-[#5c5350] text-[11px] font-semibold cursor-pointer shadow-[0_2px_4px_rgba(0,0,0,0.03)] transition-transform duration-200 hover:-translate-y-0.5";
              const diskStyles = {
                1:"w-12 bg-[#e3ede6] border border-[#c7d9cc]",
                2:"w-[72px] bg-[#d7e4db] border border-[#b7ccbf]",
                3:"w-24 bg-[#f2e6df] border border-[#e2cbc0]",
                4: "w-[120px] bg-[#faede3] border border-[#ecd5c4]",
                5: "w-36 bg-[#e6edf2] border border-[#cbd7e2]"
              };
              element.className += " " + diskStyles[disk];
              element.textContent = disk;
              const isTopDisk = diskIndex === towers[towerIndex].length - 1;
              if (selectedTower === towerIndex && isTopDisk) {
                element.classList.add("!-translate-y-[6px]",  "!border-[#8c7a6b]", "!shadow-[0_6px_12px_rgba(0,0,0,0.08)]",  "!z-[10]");
              }
              container.appendChild(element);
            }
          );
        }
      );
      document.getElementById("movesText").textContent = "Moves: " + moves;
      document.getElementById("diskCount").textContent = numberOfDisks;
      document.getElementById("minMovesText").textContent = "Min Moves: " + (Math.pow(2, numberOfDisks) - 1);
      updateGuideArrow();
    }
    // TOWER CLICK
    document.querySelectorAll("[data-tower]").forEach(tower => {
        tower.addEventListener("click",() => {
            const index = Number(tower.dataset.tower);
            handleTowerClick(index);
          }
        );
      });
    // HANDLE TOWER
    function handleTowerClick(index) {
      if (selectedTower === null) {
        if (towers[index].length === 0) {
          document.getElementById("message").textContent = "This space is empty.";
          return;
        }
        selectedTower = index;
        document.getElementById("message").textContent = "Token lifted. Choose your destination.";
        updateUI();
        return;
      }
      if (selectedTower === index) {
        selectedTower = null;
        document.getElementById("message").textContent = "Selection released.";
        updateUI();
        return;
      }
      moveDisk(selectedTower, index);
    }
    // MOVE DISK
    function moveDisk(from, to) {
      const source = towers[from];
      const destination = towers[to];
      const disk = source[source.length - 1];
      const top = destination[destination.length - 1];
      if (top !== undefined && disk > top) {
        triggerError();
        return;
      }
      source.pop();
      destination.push(disk);
      moves++;
      selectedTower = null;
      document.getElementById("message").textContent = "Placed gently.";
      updateUI();
      checkWin();
    }
    // ERROR
    function triggerError() {
      const gameEl = document.getElementById("game");
      const msgEl = document.getElementById("message");
      gameEl.classList.add( "border-[#e28a8a]", "animate-gentle-shake");
      msgEl.textContent = "A larger token cannot rest on a smaller one.";
      setTimeout(() => {
        gameEl.classList.remove( "border-[#e28a8a]", "animate-gentle-shake" );
        msgEl.textContent = "Selection reset.";
        selectedTower = null;
        updateUI();
      }, 600);
    }
    // CHECK WIN
    function checkWin() {
      if ( towers[2].length ===numberOfDisks) {
        const modal = document.getElementById("victoryModal" );
        document.getElementById( "victoryText").textContent = `Completed peacefully in ${moves} moves.`;
        modal.classList.remove(  "hidden", "opacity-0", "pointer-events-none");
        modal.classList.add( "flex",  "opacity-100",  "pointer-events-auto"
        );
      }
    }
    // RESET
    function resetGame() {
      startGame();
      document.getElementById("message").textContent = "Everything is reset.";
      const modal = document.getElementById("victoryModal"
        );
      modal.classList.add( "hidden", "opacity-0", "pointer-events-none"
      );
      modal.classList.remove( "flex", "opacity-100", "pointer-events-auto");
    }
    // ADD DISK
    function addDisk() {
      if ( numberOfDisks >= MAX_DISKS) {
        return;
      }
      numberOfDisks++;
      startGame();
    }
    // REMOVE DISK
    function removeDisk() {
      if ( numberOfDisks <= MIN_DISKS)
       { return;
      }
      numberOfDisks--;
      startGame();
    }
    // CLOSE VICTORY
    function closeVictoryModal() {
      const modal =  document.getElementById("victoryModal");
      modal.classList.add( "hidden", "opacity-0", "pointer-events-none");
      modal.classList.remove("flex", "opacity-100", "pointer-events-auto");
      resetGame();
    }
    // GUIDE ARROW
    const guideArrow = document.getElementById( "guideArrow" );
    const guidePath = document.getElementById("guidePath"
      );
    let pointerX =
      window.innerWidth / 2;
    let pointerY =
      window.innerHeight / 2;
    document.addEventListener( "pointermove",
      event => {
        pointerX =  event.clientX;
        pointerY = event.clientY;
         updateGuideArrow();
      },
      {
        passive: true
      }
    );
    function updateGuideArrow() {
      if (selectedTower === null) { guideArrow.classList.add(  "hidden"
        );
        return;
      }
      const selectedDisk = document.querySelector( ".!-translate-y-\\[6px\\]"
        );
      if (!selectedDisk) {
        guideArrow.classList.add("hidden");
        return;
      }
      const gameRect = document .getElementById("game") .getBoundingClientRect();
      let targetX = Math.max(gameRect.left + 15, Math.min(pointerX, gameRect.right - 15));
      let targetY = Math.max( gameRect.top + 15, Math.min(pointerY, gameRect.bottom - 15 ) );
      const rect = selectedDisk.getBoundingClientRect();
      const startX = rect.right;
      const startY = rect.top + rect.height / 2;
      const dx = targetX - startX;
      const dy = targetY - startY;
      const distance = Math.sqrt(dx * dx + dy * dy
        );
     if (distance < 25) { 
        guideArrow.classList.add("hidden" );
     }
     else {
        const gap = 16;
        const endX = targetX - (dx / distance) * gap;
        const endY = targetY - (dy / distance) * gap;
        const controlX = (startX + endX) / 2;
        const controlY =  Math.min( startY, endY ) - Math.max(25, Math.abs(dx) * 0.1);
        const pathData = `M ${startX} ${startY} Q ${controlX} ${controlY} ${endX} ${endY}`;
        guidePath.setAttribute("d", pathData );
        guideArrow.classList.remove(
          "hidden"
        );
      }
    }
    startGame();
  </script>
</body>
</html>
